name: Releaser

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  releaser:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve merge commit of this PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .merge_commit_sha)"
          echo "resolved merge sha: $sha"
          mkdir -p out
          printf '{"version":"%s"}\n' "$sha" > out/release.json
          cat out/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: version.json
          path: out/release.json
